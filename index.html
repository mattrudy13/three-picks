        <div class="slip-foot"><span id="rolled"></span><span id="pool"></span></div>
        <p id="msg" class="msg" hidden></p>
        <button id="reroll" type="button">NEW PICKS</button>
      </div>
      <div class="tear" aria-hidden="true"></div>
    </article>
  </div>
  <p class="fine">Same picks for everyone · DraftKings lines via ESPN · Just for fun</p>
  <p id="mode" class="fine" hidden></p>
